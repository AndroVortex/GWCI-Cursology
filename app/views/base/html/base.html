    <!-- Se ejecuta antes de cargar el CSS para que no parpadee el tema equivocado. -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('cursology-theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <link rel="stylesheet" href="assets.php?path=base/css/base.css">
